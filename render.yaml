services:
  - type: web
    name: reel-generator-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Chunked video uploads write several parts to disk at once
      # (UPLOAD_CONCURRENCY in the frontend). fs writes go through libuv's
      # threadpool, which defaults to only 4 threads - below the 10
      # concurrent chunk uploads the client now sends, so writes would
      # queue behind each other. Must be set as a real environment
      # variable (libuv reads it once at process start), not in code.
      - key: UV_THREADPOOL_SIZE
        value: "12"
      - key: PORT
        value: 5000
      - key: STORAGE_DIR
        value: ./storage
      # How long (in minutes) a file can sit in storage/downloads,
      # storage/clips, or storage/uploads before the periodic sweep in
      # server.js deletes it. Free-instance disk is small and ephemeral,
      # so this is the backstop that keeps it from filling up — raise it
      # if you need more time to download clips before they're purged.
      - key: STORAGE_MAX_AGE_MINUTES
        value: "60"
      - key: STORAGE_SWEEP_INTERVAL_MINUTES
        value: "15"
      # Free instances are 512MB RAM / 0.1 CPU (a tenth of a core) — far
      # less than a Starter instance. Uploads are capped smaller and
      # concurrency is kept to 1 everywhere so a single job doesn't get
      # OOM-killed or starve the event loop; jobs will simply take longer
      # than on a paid plan.
      - key: MAX_UPLOAD_FILE_SIZE
        value: "524288000" # 500MB — a 5GB cap risked OOM-killing the free instance's 512MB
      - key: UPLOAD_CHUNK_SIZE
        value: "6291456" # 6MB — smaller chunks finish faster and lose less progress on a weak/unstable connection
      - key: CLIENT_ORIGIN
        # Origins do not include a trailing slash. A trailing slash causes the
        # browser's Origin header to fail the exact CORS match.
        value: https://reel-generator-ten.vercel.app
      - key: MONGO_URI
        sync: false # your MongoDB Atlas connection string
      - key: MONGO_MAX_POOL_SIZE
        value: "5"
      - key: MONGO_MIN_POOL_SIZE
        value: "1"
      - key: MONGO_MAX_RETRIES
        value: "8"
      - key: MONGO_RETRY_DELAY_MS
        value: "5000"
      - key: GROQ_API_KEY
        sync: false # your Groq API key
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3
      - key: GROQ_ANALYSIS_MODEL
        value: openai/gpt-oss-120b
      - key: YTDLP_COOKIES_FILE
        sync: false # optional path to a securely mounted yt-dlp cookies.txt
      - key: YTDLP_CONCURRENT_FRAGMENTS
        value: "4" # lower than the default 16 — 0.1 CPU can't usefully parallelize much more
      - key: MIN_CLIP_SECONDS
        value: "30"
      - key: MAX_CLIP_SECONDS
        value: "120"
      - key: MIN_CLIPS_PER_JOB
        value: "5"
      - key: MAX_CLIPS_PER_JOB
        value: "15" # lower than the Starter default of 30 — each clip is a full ffmpeg encode on a tenth of a core
      - key: MAX_CONCURRENT_JOBS
        value: "1" # one job at a time — 512MB has no headroom for parallel ffmpeg/whisper work
      - key: CLIP_RENDER_CONCURRENCY
        value: "1" # same reasoning — concurrent ffmpeg encodes would fight over the single 0.1 CPU core
