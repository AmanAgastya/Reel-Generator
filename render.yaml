services:
  - type: web
    name: reel-generator-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    disk:
      name: reel-generator-storage
      # Uploads are stored and processed at their original size (no
      # compression), and MAX_UPLOAD_FILE_SIZE now allows up to 5GB per
      # video — a 5GB disk could be filled by a single upload. Sized to
      # comfortably hold a few large in-flight jobs (source + rendered
      # clips) at once; raise further if you expect heavier concurrent
      # traffic.
      mountPath: /app/storage
      sizeGB: 20
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: STORAGE_DIR
        value: ./storage
      - key: MAX_UPLOAD_FILE_SIZE
        value: "5368709120" # 5GB — uploads are never compressed
      - key: UPLOAD_CHUNK_SIZE
        value: "16777216" # 16MB — must match frontend CHUNK_SIZE
      - key: CLIENT_ORIGIN
        # Origins do not include a trailing slash. A trailing slash causes the
        # browser's Origin header to fail the exact CORS match.
        value: https://reel-generator-ten.vercel.app
      - key: MONGO_URI
        sync: false # your MongoDB Atlas connection string
      - key: MONGO_MAX_POOL_SIZE
        value: "10"
      - key: MONGO_MIN_POOL_SIZE
        value: "2"
      - key: MONGO_MAX_RETRIES
        value: "8"
      - key: MONGO_RETRY_DELAY_MS
        value: "5000"
      - key: GROQ_API_KEY
        sync: false # your Groq API key
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3
      - key: GROQ_ANALYSIS_MODEL
        value: llama-3.3-70b-versatile
      - key: YTDLP_COOKIES_FILE
        sync: false # optional path to a securely mounted yt-dlp cookies.txt
      - key: MIN_CLIP_SECONDS
        value: "15"
      - key: MAX_CLIP_SECONDS
        value: "60"
      - key: MIN_CLIPS_PER_JOB
        value: "8"
      - key: MAX_CLIPS_PER_JOB
        value: "30"
      - key: MAX_CONCURRENT_JOBS
        value: "4"